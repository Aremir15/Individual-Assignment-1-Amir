<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="page-container">
        <section class="form-card">
            <div class="icon">👤</div>

            <h1>Personal Profile</h1>
            <p class="subtitle">Please complete the form below.</p>

            <form action="ProfileServlet" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId"
                           placeholder="Enter your student ID" required>
                </div>

                <div class="form-group">
                    <label for="program">Program</label>
                    <input type="text" id="program" name="program"
                           placeholder="Enter your program" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email address" required>
                </div>

                <fieldset class="form-group hobbies-group">
                    <legend>Hobbies</legend>

                    <label class="checkbox-label">
                        <input type="checkbox" name="hobbies" value="Reading">
                        Reading
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="hobbies" value="Gaming">
                        Gaming
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="hobbies" value="Sports">
                        Sports
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="hobbies" value="Music">
                        Music
                    </label>

                    <label class="checkbox-label">
                        <input type="checkbox" name="hobbies" value="Traveling">
                        Traveling
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="introduction">Short Self-Introduction</label>
                    <textarea id="introduction" name="introduction" rows="5"
                              placeholder="Write a short introduction about yourself..."
                              required></textarea>
                </div>

                <button type="submit">Submit Profile</button>
            </form>
        </section>
    </main>

</body>
</html>
